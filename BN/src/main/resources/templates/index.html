<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온도 상담웹</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(180deg, #eff6ff 0%, #f4f7fb 100%);
            color: #1f2937;
            min-height: 100vh;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 16px 64px;
        }
        .hero {
            text-align: center;
            margin-bottom: 32px;
        }
        .hero h1 {
            margin: 0 0 12px;
            font-size: 36px;
        }
        .hero p {
            margin: 0;
            color: #4b5563;
            line-height: 1.6;
        }
        .cards {
            display: grid;
            gap: 16px;
        }
        @media (min-width: 640px) {
            .cards { grid-template-columns: 1fr 1fr; }
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }
        .card h2 {
            margin: 0 0 10px;
            font-size: 20px;
        }
        .card p {
            margin: 0 0 18px;
            color: #6b7280;
            line-height: 1.5;
            font-size: 14px;
        }
        .btn {
            display: inline-block;
            padding: 11px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .btn-primary {
            background: #2563eb;
            color: #fff;
        }
        .btn-secondary {
            background: #111827;
            color: #fff;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .footer {
            margin-top: 28px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1>온도 상담웹</h1>
        <p>학생과 교사가 안전하게 상담을 준비하고 이어갈 수 있는 학교 상담 플랫폼입니다.</p>
    </div>

    <div class="cards">
        <div class="card">
            <h2>학생</h2>
            <p>담당 교사를 등록하고 상담 사전 정보를 작성할 수 있습니다.</p>
            <div class="actions">
                <a class="btn btn-primary" href="/login">로그인</a>
                <a class="btn btn-secondary" href="/join">회원가입</a>
            </div>
        </div>
        <div class="card">
            <h2>교사</h2>
            <p>초대 코드로 학생을 연결하고 상담 요청을 확인·답변할 수 있습니다.</p>
            <div class="actions">
                <a class="btn btn-primary" href="/login">로그인</a>
                <a class="btn btn-secondary" href="/join">회원가입</a>
            </div>
        </div>
    </div>

    <div class="footer">
        민감정보(상담 내용)는 별도 동의 후 수집·이용됩니다.
    </div>
</div>
</body>
</html>
