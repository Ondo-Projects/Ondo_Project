<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>JOIN PAGE</h1>
    <form action="/join" method="post">
        <input type="text" name="username" placeholder="아이디" required /><br>
        <input type="password" name="password" placeholder="비밀번호" required /><br>


        <label><input type="radio" name="role" value="ROLE_STUDENT" checked> 학생</label>
        <label><input type="radio" name="role" value="ROLE_TEACHER"> 선생님</label>
        <label><input type="radio" name="role" value="ROLE_ADMIN"> 관리자</label><br>

        <button type="submit">가입하기</button>
    </form>

</body>
</html>
