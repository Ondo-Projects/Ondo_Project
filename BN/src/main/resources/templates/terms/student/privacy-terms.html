<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="terms-block">
    <label class="terms-label">[학생] 개인정보 수집 및 이용 안내 전문</label>
    <textarea class="terms-textbox" readonly rows="16">[학생 - 개인정보 수집 및 이용 안내]

1. 개인정보의 수집·이용 목적
- 학생 본인 확인, 서비스 이용 자격 확인(학교/학년/반 식별)
- 상담 및 생활지도 서비스 제공, 주요 공지사항 및 안내 전달
- 부정 이용 방지 및 서비스 이용 기록 통계 분석

2. 수집하는 개인정보 항목
- [필수] 성명, 아이디, 비밀번호, 생년월일, 이메일, 휴대전화번호, 학교명, 학년, 반, 보호자(법정대리인) 연락처
- [자동 수집] IP 주소, 쿠키, 서비스 이용 기록, 접속 로그

3. 개인정보의 보유 및 이용 기간
- 회원 탈퇴 시 또는 졸업/서비스 종료 시까지 지체 없이 파기합니다.
- 단, 관계 법령에 따라 보존 의무가 있는 경우 법정 기간 동안 안전하게 보관합니다.
  · 접속 기록(로그): 3개월 (통신비밀보호법)

4. 동의 거부 권리 및 불이익
이용자는 개인정보 수집·이용 동의를 거부할 수 있습니다. 다만, 필수 항목 동의 거부 시 회원가입 및 상담 서비스 이용이 제한됩니다.</textarea>
</div>
</body>
</html>
