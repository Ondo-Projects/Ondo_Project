<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="terms-block">
    <label class="terms-label">[만 14세 미만] 법정대리인 동의서 전문</label>
    <textarea class="terms-textbox" readonly rows="20">[만 14세 미만 아동의 개인정보 처리 및 법정대리인 동의서]

온도 상담웹(이하 "회사")은 「개인정보 보호법」 제22조의2 및 관련 법령에 따라 만 14세 미만 아동의 개인정보를 수집·이용하고자 하는 경우 법정대리인(부모 등)의 동의를 받고 있습니다.

아래 내용을 확인하신 후, 자녀(아동)의 회원가입 및 개인정보·민감정보 처리에 동의해 주시기 바랍니다.

1. 법정대리인 동의 정보 수집
- 수집 항목: 법정대리인 성명, 휴대전화번호, 아동과의 관계, 본인인증값(CI/DI)
- 수집 및 이용 목적: 만 14세 미만 아동의 개인정보 수집에 대한 법정대리인 동의 의사 확인 및 본인 확인
- 보유 및 이용 기간: 아동의 회원 탈퇴 시 또는 법정대리인 동의 철회 시까지 (단, 법률에 특별한 규정이 있는 경우 해당 기간까지 보관)

2. 아동의 개인정보 수집 및 이용 동의
- 수집 및 이용 목적: 학생 회원가입, 본인 식별, 상담 및 학습·생활지도 서비스 제공, 주요 공지사항 전달
- 수집하는 개인정보 항목: 성명, 생년월일, 학교명, 학년/반, 아이디, 비밀번호, 이메일, 휴대전화번호
- 보유 및 이용 기간: 회원 탈퇴 시 또는 서비스 종료 시까지

3. 아동의 민감정보(상담 내용) 수집 및 이용 별도 동의
- 수집 및 이용 목적: 개인 맞춤형 상담, 정서·심리 상태 파악, 위기 상황 예방 및 학생 생활지도
- 수집하는 민감정보 항목: 상담 신청 사유, 상담 대화 및 기록 내역, 심리검사 결과
- 보유 및 이용 기간: 서비스 이용 기간 동안 보관하며, 회원 탈퇴 또는 상담 종료 후 3년 보관 후 파기합니다.
- 비밀유지 및 예외: 수집된 상담 기록은 비밀이 보장되나, 자녀의 생명·신체에 중대한 위험이 있거나 법률상 신고 의무(아동학대, 학교폭력 등)가 발생하는 긴급 상황에는 관련 기관 및 보호자에게 제공될 수 있습니다.

4. 법정대리인의 권리 및 행사 방법
- 법정대리인은 언제든지 만 14세 미만 아동의 개인정보 수집·이용·제공에 대한 동의를 철회할 수 있으며, 아동이 제공한 개인정보의 열람 및 정정을 요구할 수 있습니다.
- 동의 철회 시 아동의 회원가입 및 상담 서비스 이용이 제한됩니다.

5. 동의 거부 권리 및 불이익
법정대리인은 자녀의 개인정보 및 민감정보 수집·이용에 대한 동의를 거부할 권리가 있습니다. 단, 필수 항목 동의 거부 시 아동의 서비스 회원가입 및 상담 이용이 불가능합니다.</textarea>
</div>
