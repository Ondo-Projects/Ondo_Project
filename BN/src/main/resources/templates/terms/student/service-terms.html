<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="terms-block">
    <label class="terms-label">[학생] 서비스 이용약관 전문</label>
    <textarea class="terms-textbox" readonly rows="14">[서비스 이용약관]

제1조 (목적)
본 약관은 온도 상담웹(이하 "회사")이 제공하는 학생 상담 및 학습·생활지도 서비스(이하 "서비스")의 이용조건 및 절차, 학생 이용자의 권리·의무를 규정함을 목적으로 합니다.

제2조 (회원가입 및 계정 관리)
1. 학생 이용자는 본인의 정확한 정보(성명, 학교, 학년/반 등)를 입력하여 회원가입을 신청합니다.
2. 만 14세 미만 학생의 경우, 「개인정보 보호법」에 따라 법정대리인(부모 등)의 동의 절차를 거쳐 가입이 완료됩니다.
3. 계정과 비밀번호는 본인만 사용해야 하며, 타인에게 대여하거나 공유할 수 없습니다.

제3조 (서비스 이용 및 주의사항)
1. 학생은 상담 서비스를 통해 교사 및 전문가와 정서·학업·진로 등에 대해 상담을 진행할 수 있습니다.
2. 학생은 타인의 개인정보를 도용하거나, 상담 공간에서 불법·유해 콘텐츠 게시, 비방, 욕설 등 서비스 운영을 방해하는 행위를 해서는 안 됩니다.

제4조 (서비스 중단 및 면책)
회사는 정보통신설비의 점검, 교체, 고장 또는 천재지변 등 불가항력적 사유가 발생한 경우 서비스 제공을 일시적으로 중단할 수 있습니다.</textarea>
</div>
</body>
</html>
