<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="terms-block">
    <label class="terms-label">[학생] 민감정보(상담 내용) 수집 및 이용 동의 전문</label>
    <textarea class="terms-textbox" readonly rows="18">[학생 - 민감정보(상담 내용) 수집 및 이용 동의]

1. 민감정보 수집·이용 목적
- 개인 맞춤형 상담, 심리·정서적 상태 파악, 학습 및 생활지도 지원
- 위기 상황(자해, 학교폭력, 학대 등) 사전 예방 및 상담 이력 관리
- 「초·중등교육법」 및 교육부 훈령에 따른 학생 상담 및 지도 기록 관리

2. 수집하는 민감정보 항목
- 상담 신청 사유, 상담 대화/기록 내역, 심리검사 결과, 정서 및 행동 특성 평가 기록

3. 보유 및 이용 기간
- 서비스 이용 기간 동안 보관하며, 회원 탈퇴 또는 상담 관계 종료 후 3년 보관 후 파기합니다.

4. 비밀유지 의무 및 예외 규정 (중요)
- 수집된 상담 내용은 「초·중등교육법」 및 「개인정보 보호법」에 따라 엄격히 비밀이 보장됩니다.
- 단, 다음 각 호의 긴급 상황의 경우 법령에 의거하여 보호자 또는 관련 기관(경찰, 전문상담기관 등)에 정보가 제공될 수 있습니다.
  1) 학생 본인 또는 타인의 생명·신체·재산에 중대한 위험이 발생할 우려가 있는 경우
  2) 아동학대, 학교폭력, 범죄 피해 등 법률상 신고 의무가 발생하는 경우
  3) 법원의 명령이나 법률 규정에 따른 구체적 제출 요구가 있는 경우

5. 동의 거부 권리 및 불이익
민감정보 처리에 대한 동의를 거부할 수 있으나, 본 동의는 상담 서비스 제공을 위한 필수 사항이므로 거부 시 상담 서비스 이용이 제한됩니다.</textarea>
</div>
</body>
</html>
