    <label class="terms-label">[교사] 학생 민감정보 처리 및 비밀유지 의무 동의 전문</label>
    <textarea class="terms-textbox" readonly rows="18">[교사 - 학생 민감정보 처리 및 비밀유지 의무 동의]

1. 학생 민감정보 처리 목적
- 교사 회원은 「초·중등교육법」 및 관련 훈령(학교생활기록부 작성 및 관리지침 등)에 따라 학생 지도, 상담 및 정서적 지원 목적으로만 학생의 민감정보(상담 기록, 심리 상태 등)를 처리·열람합니다.

2. 비밀유지 의무 (개인정보 보호법 및 초·중등교육법 준수)
- 교사 회원은 서비스 이용 과정에서 취득한 학생의 모든 상담 내역, 정서 평가, 개인정보에 대해 엄격한 비밀유지 의무를 집니다.
- 교사 회원은 학생의 민감정보를 제3자에게 누설, 제공, 양도하거나 교육 목적 외의 용도로 이용·복사·유출할 수 없습니다.

3. 안전성 확보 및 기록 관리 책임
- 교사 회원은 서비스 접속 계정 보안 관리를 철저히 해야 하며, 공용 PC 등에서 로그인 상태를 유지하여 타인에게 학생 기록이 노출되지 않도록 주의해야 합니다.
- 교사가 작성한 상담 및 지도 기록은 학교 행정 및 학생 지도의 법적 근거 자료로 활용될 수 있으며, 시스템 내에 안전하게 보존됩니다.

4. 의무 위반 시 책임
본 비밀유지 의무를 위반하여 학생의 개인정보 및 민감정보를 유출·남용한 경우, 「개인정보 보호법」, 「초·중등교육법」 및 관련 법령에 따라 형사 처벌 및 징계 조치의 대상이 될 수 있습니다.</textarea>
