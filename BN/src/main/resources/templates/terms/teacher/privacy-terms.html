<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="terms-block">
    <label class="terms-label">[교사] 개인정보 수집 및 이용 안내 전문</label>
    <textarea class="terms-textbox" readonly rows="16">[교사 - 개인정보 수집 및 이용 안내]

1. 개인정보의 수집·이용 목적
- 교사 회원가입 및 교직원 신원·재직 확인(본인 인증)
- 학생 상담 및 관리 서비스 권한 부여, 학생과의 상담 연결
- 서비스 관련 주요 공지, 시스템 점검 및 보안 안내 전달

2. 수집하는 개인정보 항목
- [필수] 성명, 아이디, 비밀번호, 공공 이메일(또는 학교 이메일), 휴대전화번호, 소속 학교명, 담당 학년/반/과목
- [선택] 교선 전용 내선번호
- [자동 수집] IP 주소, 쿠키, 서비스 이용 및 접속 기록

3. 개인정보의 보유 및 이용 기간
- 회원 탈퇴 시 또는 교사 재직 인증 만료 시까지 보관 후 지체 없이 파기합니다.
- 단, 교사 작성 기록의 법적 검증이 필요한 경우 관련 법령에 따라 일정한 기간 동안 안전하게 보존될 수 있습니다.

4. 동의 거부 권리 및 불이익
교사 회원은 개인정보 수집 및 이용 동의를 거부할 권리가 있습니다. 다만 필수 항목 동의 거부 시 교사 회원가입 및 상담 관리 서비스 이용이 불가합니다.</textarea>
</div>
