<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="terms-block">
    <label class="terms-label">[교사] 서비스 이용약관 전문</label>
    <textarea class="terms-textbox" readonly rows="14">[서비스 이용약관]

제1조 (목적)
본 약관은 온도 상담웹(이하 "회사")이 제공하는 교사용 학생 상담 및 지도 관리 플랫폼 서비스(이하 "서비스")의 이용조건 및 절차, 교사 회원의 권리·의무 및 책임을 규정함을 목적으로 합니다.

제2조 (회원가입 및 교사 인증)
1. 교사 회원가입은 현직 교직원 및 승인된 상담 전문가에 한해 가능합니다.
2. 회사는 교사 회원의 신원 및 재직 여부를 확인하기 위해 교원 인증(공공인증서, GPKI, 학교 이메일 인증 등)을 요구할 수 있습니다.
3. 교사 회원은 본인의 계정 정보를 타인(동료 교사 포함)에게 공유하거나 대여할 수 없습니다.

제3조 (교사의 권리와 의무)
1. 교사 회원은 담당 학생과의 상담 및 지도 목적에 한하여 본 서비스를 이용해야 합니다.
2. 교사 회원은 서비스 이용 중 알게 된 학생의 개인정보 및 민감정보(상담 기록)를 외부에 유출하거나 목적 외 용도로 활용해서는 안 됩니다.

제4조 (계정 관리 및 서비스 이용 제한)
교사 회원이 타인의 명의를 도용하거나, 학생 민감정보를 무단 유출하는 등 관련 법령 및 본 약관을 위반한 경우, 회사는 즉시 계정을 정지하고 법적 조치를 취할 수 있습니다.</textarea>
</div>
</body>
</html>
