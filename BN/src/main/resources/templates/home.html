<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 홈 | 온도 상담웹</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            overflow-x: hidden;
            max-width: 100%;
        }
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }
        .container {
            max-width: 760px;
            margin: 32px auto;
            padding: 0 16px 40px;
            min-width: 0;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            margin-bottom: 20px;
            min-width: 0;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .page-header > div:first-child {
            min-width: 0;
            flex: 1 1 180px;
        }
        .page-header h1 {
            margin: 0;
            font-size: 26px;
        }
        .subtitle { color: #6b7280; margin: 6px 0 0; font-size: 14px; }
        .user-greeting {
            margin: 0 0 6px;
            font-size: 15px;
            font-weight: 600;
            color: #1e3a8a;
            overflow-wrap: anywhere;
            word-break: keep-all;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .header-actions form {
            display: inline-flex;
            margin: 0;
        }
        .btn-secondary, .btn-primary {
            border: none;
            border-radius: 10px;
            padding: 11px 16px;
            font-size: 14px;
            cursor: pointer;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-secondary { background: #e5e7eb; color: #111827; }
        .btn-primary { background: #2563eb; color: #fff; }
        .role-block h2 {
            font-size: 18px;
            margin: 0 0 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e5e7eb;
        }
        .role-block p {
            margin: 0 0 16px;
            color: #4b5563;
            line-height: 1.6;
        }
        .role-block-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .common-strip {
            display: grid;
            gap: 8px;
        }
        .today-date {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            color: #374151;
        }
        .school-meta {
            margin: 0;
            font-size: 14px;
            color: #1f2937;
            line-height: 1.5;
            overflow-wrap: anywhere;
            word-break: keep-all;
        }
        .weather-box {
            display: flex;
            align-items: center;
            gap: 16px;
            background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
            border: 1px solid #bfdbfe;
            border-radius: 16px;
            padding: 18px 20px;
            min-width: 0;
        }
        .weather-box-compact {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .weather-box-compact .weather-icon { font-size: 36px; }
        .weather-box-compact .weather-temp { font-size: 24px; }
        .weather-icon {
            font-size: 42px;
            line-height: 1;
            flex-shrink: 0;
        }
        .weather-main {
            flex: 1;
            min-width: 0;
        }
        .weather-temp {
            font-size: 28px;
            font-weight: 700;
            color: #1e3a8a;
            margin-bottom: 4px;
        }
        .weather-condition {
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
        }
        .weather-range {
            color: #6b7280;
            font-size: 14px;
            margin-top: 6px;
        }
        .empty-state {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }
        .helper {
            margin: 0;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.5;
        }
        .message {
            margin-bottom: 16px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #fef2f2;
            color: #b91c1c;
        }
        .hidden { display: none !important; }
        @media (max-width: 640px) {
            .container { margin: 24px auto; padding: 0 12px 32px; }
            .card { padding: 20px; }
            .page-header h1 { font-size: 22px; }
            .weather-box,
            .weather-box-compact {
                flex-wrap: wrap;
            }
            .weather-temp { font-size: 24px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="page-header">
        <div>
            <p class="user-greeting" id="userGreeting">불러오는 중...</p>
            <h1>학교 홈</h1>
            <p class="subtitle">오늘의 학교 생활을 한곳에서 시작하세요.</p>
        </div>
        <div class="header-actions">
            <form action="/logout" method="post">
                <button type="submit" class="btn-secondary">로그아웃</button>
            </form>
        </div>
    </div>

    <div class="message hidden" id="pageError"></div>

    <div class="card common-strip" id="commonStrip">
        <p class="today-date" id="todayDate"></p>
        <p class="school-meta" id="schoolMeta">불러오는 중...</p>
        <p class="helper" id="weatherRegionHint">-</p>
        <div id="weatherBox">
            <div class="empty-state">날씨 정보를 불러오는 중...</div>
        </div>
    </div>

    <div class="card role-block hidden" id="studentBlock">
        <h2>학생</h2>
        <p>급식, 마음 날씨, 알림, 상담 기능은 학생 홈에서 이용할 수 있습니다.</p>
        <div class="role-block-actions">
            <a class="btn-primary" href="/student">학생 홈 전체 보기</a>
        </div>
    </div>

    <div class="card role-block hidden" id="teacherBlock">
        <h2>교사</h2>
        <p>상담 대기, 마음 날씨, 사전상담 확인은 교사 홈에서 이용할 수 있습니다.</p>
        <div class="role-block-actions">
            <a class="btn-primary" href="/teacher">교사 홈 전체 보기</a>
        </div>
    </div>
</div>

<script>
    const userGreeting = document.getElementById('userGreeting');
    const pageError = document.getElementById('pageError');
    const studentBlock = document.getElementById('studentBlock');
    const teacherBlock = document.getElementById('teacherBlock');
    const todayDate = document.getElementById('todayDate');
    const schoolMeta = document.getElementById('schoolMeta');
    const weatherRegionHint = document.getElementById('weatherRegionHint');
    const weatherBox = document.getElementById('weatherBox');

    todayDate.textContent = new Intl.DateTimeFormat('ko-KR', { dateStyle: 'full' }).format(new Date());

    async function api(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            credentials: 'same-origin',
            headers: {
                'Content-Type': 'application/json',
                ...(options.headers || {})
            }
        });
        if (response.status === 401) {
            window.location.href = '/login?sessionExpired=true';
            throw new Error('로그인이 필요합니다.');
        }
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
            throw new Error(data.message || data.error || '요청에 실패했습니다.');
        }
        return data;
    }

    function showPageError(message) {
        pageError.textContent = message;
        pageError.classList.remove('hidden');
    }

    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function renderWeather(data) {
        if (data.region) {
            weatherRegionHint.textContent = `${data.region} 날씨입니다.`;
        }

        const minMax = (data.minTemperature && data.maxTemperature)
            ? `최저 ${escapeHtml(data.minTemperature)} / 최고 ${escapeHtml(data.maxTemperature)}`
            : '';

        weatherBox.innerHTML = `
            <div class="weather-box weather-box-compact">
                <div class="weather-icon">${data.icon || '🌡️'}</div>
                <div class="weather-main">
                    <div class="weather-temp">${escapeHtml(data.temperature || '-')}</div>
                    <div class="weather-condition">${escapeHtml(data.condition || '정보 없음')}</div>
                    ${minMax ? `<div class="weather-range">${minMax}</div>` : ''}
                    ${data.message ? `<p class="helper">${escapeHtml(data.message)}</p>` : ''}
                </div>
            </div>
        `;
    }

    async function loadWeather() {
        try {
            const data = await api('/api/common/weather/today');
            renderWeather(data);
        } catch (error) {
            weatherBox.innerHTML = `<div class="empty-state">${escapeHtml(error.message)}</div>`;
        }
    }

    function formatSchoolTypeLabel(schoolType) {
        if (schoolType === '중') return '중학교';
        if (schoolType === '고') return '고등학교';
        return schoolType || '-';
    }

    function resolveSchoolName(me, schoolProfile) {
        if (schoolProfile && schoolProfile.schoolName && schoolProfile.schoolName.trim()) {
            return schoolProfile.schoolName.trim();
        }
        if (me.schoolName && me.schoolName.trim()) {
            return me.schoolName.trim();
        }
        return '학교 미등록';
    }

    function renderUserGreeting(me, schoolProfile) {
        const displayName = me.name && me.name.trim() ? me.name.trim() : me.username;
        userGreeting.textContent = `${displayName} · ${resolveSchoolName(me, schoolProfile)}`;
    }

    function renderCommonStrip(me, schoolProfile) {
        if (schoolProfile && schoolProfile.schoolName) {
            schoolMeta.textContent = `${schoolProfile.schoolName} · ${formatSchoolTypeLabel(schoolProfile.schoolType)} · ${schoolProfile.region || '지역 정보 없음'}`;
            return;
        }

        const fallbackSchool = resolveSchoolName(me, null);
        if (fallbackSchool === '학교 미등록') {
            schoolMeta.textContent = '등록된 학교가 없습니다. 학생·교사 홈에서 학교를 등록해 주세요.';
            return;
        }

        const region = me.schoolRegion && me.schoolRegion.trim() ? me.schoolRegion.trim() : '지역 정보 없음';
        schoolMeta.textContent = `${fallbackSchool} · ${region}`;
    }

    async function loadProfileSchool(role) {
        if (role === 'STUDENT') {
            return api('/api/student/profile/school');
        }
        if (role === 'TEACHER') {
            return api('/api/teacher/profile/school');
        }
        return null;
    }

    function renderRoleBlocks(role) {
        studentBlock.classList.add('hidden');
        teacherBlock.classList.add('hidden');

        if (role === 'STUDENT') {
            studentBlock.classList.remove('hidden');
            return;
        }
        if (role === 'TEACHER') {
            teacherBlock.classList.remove('hidden');
        }
    }

    async function loadPage() {
        try {
            const me = await api('/api/auth/me');
            renderRoleBlocks(me.role);

            let schoolProfile = null;
            try {
                schoolProfile = await loadProfileSchool(me.role);
            } catch (error) {
                showPageError(error.message || '학교 정보를 불러오지 못했습니다.');
            }

            renderUserGreeting(me, schoolProfile);
            renderCommonStrip(me, schoolProfile);
            loadWeather().catch(() => {
                weatherBox.innerHTML = '<div class="empty-state">날씨 정보를 불러올 수 없습니다.</div>';
            });
        } catch (error) {
            showPageError(error.message || '페이지 정보를 불러오지 못했습니다.');
        }
    }

    loadPage();
</script>
</body>
</html>
