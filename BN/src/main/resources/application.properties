spring.application.name=ondo

# ----------------------------------------------------------------
# SERVER
# ----------------------------------------------------------------
server.port=8081

# ----------------------------------------------------------------
# REDIS (운영: ElastiCache 등으로 덮어씀)
# ----------------------------------------------------------------
spring.redis.host=localhost
spring.redis.port=6379
spring.session.store-type=none

# ----------------------------------------------------------------
# LOCAL / PROD SECRETS
# 로컬: BN/config/application-local.properties (Git 제외, example 참고)
# 운영: BN/config/application-prod.properties (Git 제외, example 참고)
#       SPRING_PROFILES_ACTIVE=prod 로 실행
# ----------------------------------------------------------------
spring.config.import=optional:file:./config/application-local.properties,optional:file:./BN/config/application-local.properties,optional:file:./config/application-prod.properties,optional:file:./BN/config/application-prod.properties

# ----------------------------------------------------------------
# MAIL (로컬 dev-mode·SMTP는 application-local.properties)
# ----------------------------------------------------------------
ondo.mail.dev-mode=false

# ----------------------------------------------------------------
# Solapi SMS (키·dev-mode는 application-local.properties)
# ----------------------------------------------------------------
ondo.solapi.dev-mode=false

# ----------------------------------------------------------------
# SMS OTP rate limit
# ----------------------------------------------------------------
ondo.sms.otp.enabled=true
ondo.sms.otp.resend-cooldown-seconds=60
ondo.sms.otp.phone-max-per-hour=5
ondo.sms.otp.ip-max-per-hour=20

# ----------------------------------------------------------------
# APP (SMS 링크 등 — 로컬 URL은 application-local.properties)
# ----------------------------------------------------------------
ondo.app.base-url=

# ----------------------------------------------------------------
# SCHOOL DATA
# ----------------------------------------------------------------
ondo.school.auto-import=true

# ----------------------------------------------------------------
# JWT (secret은 application-local / prod / env 에만 설정)
# ----------------------------------------------------------------
ondo.jwt.secret=
ondo.jwt.access-token-expiration=3600000
ondo.jwt.refresh-token-expiration=604800000

# ----------------------------------------------------------------
# NEIS / WEATHER (base URL만 공통, api-key·dev-mode는 local/prod)
# ----------------------------------------------------------------
ondo.neis.dev-mode=false
ondo.neis.base-url=https://open.neis.go.kr/hub
ondo.neis.api-key=

ondo.weather.dev-mode=false
ondo.weather.base-url=https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
ondo.weather.api-key=

# ----------------------------------------------------------------
# EXTERNAL API CACHE (Caffeine)
# ----------------------------------------------------------------
ondo.cache.external.weather-ttl-minutes=15
ondo.cache.external.neis-ttl-minutes=30
ondo.cache.external.logging-enabled=true

# ----------------------------------------------------------------
# FIELD ENCRYPTION (key·dev-mode는 application-local / prod)
# ----------------------------------------------------------------
ondo.encryption.dev-mode=false
ondo.encryption.key=

# ----------------------------------------------------------------
# ADMIN BOOTSTRAP (기본 off — local에서만 enabled=true)
# ----------------------------------------------------------------
ondo.admin.bootstrap.enabled=false
ondo.admin.bootstrap.username=
ondo.admin.bootstrap.password=
ondo.admin.bootstrap.name=시스템관리자

# ----------------------------------------------------------------
# USER ACTIVE LEGACY FIX (1회만 true, 이후 false)
# ----------------------------------------------------------------
ondo.user.legacy-active-fix.enabled=false
