spring.application.name=ondo

# ----------------------------------------------------------------
# SERVER PORT SETTING (추가된 부분)
# ----------------------------------------------------------------
server.port=8081

#----------------------------------------------------------------
# REDIS
#----------------------------------------------------------------
# REDIS SERVER SETTING
spring.redis.host=localhost
spring.redis.port=6379

# JWT 쿠키 인증 사용 — HTTP 세션(Redis) 비활성화
spring.session.store-type=none

# ----------------------------------------------------------------------------------------------------
#  OAUTH2 CLIENT OPTION
# ----------------------------------------------------------------------------------------------------


# ----------------------------------------------------------------------------------------------------
#  DATASOURCE
# ----------------------------------------------------------------------------------------------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ondo_DB?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# ----------------------------------------------------------------------------------------------------
#  MAIL (교사 @korea.kr 이메일 인증)
# ----------------------------------------------------------------------------------------------------
ondo.mail.dev-mode=true
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ----------------------------------------------------------------------------------------------------
#  NCP SENS (법정대리인 SMS 인증)
# ----------------------------------------------------------------------------------------------------
ondo.ncp.sens.dev-mode=true
ondo.ncp.sens.access-key=
ondo.ncp.sens.secret-key=
ondo.ncp.sens.service-id=
ondo.ncp.sens.sender-phone=
ondo.ncp.sens.api-url=https://sens.apigw.ntruss.com

# ----------------------------------------------------------------------------------------------------
#  Solapi SMS (Issue #16 — Step 2에서 NCP 대체)
# ----------------------------------------------------------------------------------------------------
ondo.solapi.dev-mode=true
ondo.solapi.api-key=
ondo.solapi.api-secret=
ondo.solapi.sender-phone=

# ----------------------------------------------------------------------------------------------------
#  SCHOOL DATA
# ----------------------------------------------------------------------------------------------------
ondo.school.auto-import=true

# ----------------------------------------------------------------------------------------------------
#  JWT
# ----------------------------------------------------------------------------------------------------
ondo.jwt.secret=ondo-dev-jwt-secret-key-32bytes-min!!
ondo.jwt.access-token-expiration=3600000
ondo.jwt.refresh-token-expiration=604800000

# ----------------------------------------------------------------------------------------------------
#  LOCAL SECRETS (API keys)
#  실제 키는 BN/config/application-local.properties 에 저장 (Git 제외)
#  예시: BN/config/application-local.properties.example 참고
# ----------------------------------------------------------------------------------------------------
spring.config.import=optional:file:./config/application-local.properties,optional:file:./BN/config/application-local.properties

ondo.neis.dev-mode=false
ondo.neis.base-url=https://open.neis.go.kr/hub
ondo.neis.api-key=

ondo.weather.dev-mode=false
ondo.weather.base-url=https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
ondo.weather.api-key=

# ----------------------------------------------------------------------------------------------------
#  FIELD ENCRYPTION (연락처 등)
# ----------------------------------------------------------------------------------------------------
ondo.encryption.dev-mode=true
ondo.encryption.key=

# ----------------------------------------------------------------------------------------------------
#  ADMIN BOOTSTRAP (최초 Admin 계정 — application-local.properties 에서 활성화 권장)
# ----------------------------------------------------------------------------------------------------
ondo.admin.bootstrap.enabled=true
ondo.admin.bootstrap.username=admin
ondo.admin.bootstrap.password=9903312kim.
ondo.admin.bootstrap.name=시스템관리자

# ----------------------------------------------------------------------------------------------------
#  USER ACTIVE LEGACY FIX (Step 9-2 active 컬럼 보정 — 1회만 true, 이후 false)
# ----------------------------------------------------------------------------------------------------
ondo.user.legacy-active-fix.enabled=false

