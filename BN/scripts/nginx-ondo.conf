# Ondo nginx 설정 — /etc/nginx/conf.d/ondo.conf 로 복사해서 사용
#
# ★ 이 파일은 /etc/letsencrypt/live/ondo.ai.kr/ 인증서가 있어야 nginx -t 를 통과합니다.
#   인증서가 없으면 먼저 실행: sudo bash BN/scripts/setup-https.sh
#
# 서버에서 certbot --nginx 로 이 파일을 직접 고치지 마세요.
# 수정은 repo에서 하고 다시 복사합니다. (서버에서만 고치면 다음 setup 때 덮어써져 HTTPS가 사라짐)

# ----------------------------------------------------------------
# HTTP(80): 인증서 발급·갱신용 경로만 열고 나머지는 HTTPS로 이동
# ----------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ondo.ai.kr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------
# HTTPS(443)
# ----------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ondo.ai.kr;

    ssl_certificate     /etc/letsencrypt/live/ondo.ai.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ondo.ai.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
