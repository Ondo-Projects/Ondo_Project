# Ondo nginx 설정 — /etc/nginx/conf.d/ondo.conf 로 복사해서 사용
#
# ★ 이 파일은 /etc/letsencrypt/live/ondo.ai.kr/ 인증서가 있어야 nginx -t 를 통과합니다.
#   인증서가 없으면 먼저 실행: sudo bash BN/scripts/setup-https.sh
#
# 서버에서 certbot --nginx 로 이 파일을 직접 고치지 마세요.
# 수정은 repo에서 하고 다시 복사합니다. (서버에서만 고치면 다음 setup 때 덮어써져 HTTPS가 사라짐)

# ----------------------------------------------------------------
# HTTP(80): 인증서 발급·갱신용 경로만 열고 나머지는 HTTPS로 이동
# ----------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ondo.ai.kr;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------
# HTTPS(443)
# ----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ondo.ai.kr;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/ondo.ai.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ondo.ai.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ------------------------------------------------------------
    # 보안 헤더
    # 주의: 아래 location 안에서 add_header 를 쓰면 이 헤더들이 그 location 에는
    #       붙지 않습니다(nginx 상속 규칙). location 에서는 add_header 대신 expires 를 쓰세요.
    # ------------------------------------------------------------
    # HTTPS만 쓰도록 브라우저에 기억시킴 (30일). 인증서 자동 갱신이 안정적이면 31536000(1년)으로 늘리세요.
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # CSP — 이 사이트가 실제로 쓰는 출처만 허용
    #   script/connect: 같은 출처(/assets, /api)만
    #   style/font: 같은 출처 + Pretendard 폰트(cdn.jsdelivr.net)
    #   img: 같은 출처 + data:(CSS 화살표 아이콘)
    # 1단계: Report-Only — 막지는 않고 브라우저 콘솔에 위반만 표시합니다.
    #        모든 화면에서 콘솔에 CSP 위반이 없으면 아래 줄의 "-Report-Only" 를 지워 실제로 적용하세요.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # ------------------------------------------------------------
    # 압축
    # ------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Vite 빌드 결과물은 파일 이름에 해시가 붙어 있어 오래 캐시해도 안전
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html 은 캐시하지 않음 → 배포 직후 새 화면이 바로 보임
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
